<article class="article"><div class="meta">Ralph Lauren<br>Ready-to-Wear SS27</div><div><h3>La elegancia se vuelve ligera</h3><p>Sastrería liviana, vestidos fluidos, cuero, transparencias, dorados y una elegancia que se mueve entre lo clásico y lo contemporáneo.</p><a class="read" href="https://lavoirarg.substack.com/p/ralph-lauren-springsummer-2027?r=8o6915" target="_blank" rel="noopener">Leer artículo →</a></div></article>
<article class="article"><div class="meta">Rick Owens<br>Ready-to-Wear SS27</div><div><h3>La impresión antes que la silueta</h3><p>Una lectura crítica de una colección construida sobre geometría, volumen, transparencias y una fuerte búsqueda de impacto visual.</p><a class="read" href="https://lavoirarg.substack.com/p/rick-owens?r=8o6915" target="_blank" rel="noopener">Leer artículo →</a></div></article>
<article class="article"><div class="meta">Isabel Marant<br>Ready-to-Wear SS27</div><div><h3>El verano californiano bajo la mirada de Isabel Marant</h3><p>Cintura marcada, transparencias, texturas, volumen y una referencia al verano libre de Los Ángeles de los años setenta.</p><a class="read" href="https://lavoirarg.substack.com/p/isabel-marant?r=8o6915" target="_blank" rel="noopener">Leer artículo →</a></div></article>
<article class="article"><div class="meta">Schiaparelli<br>Ready-to-Wear SS27</div><div><h3>Going Clear: cuando el glamour toma el control del cuerpo</h3><p>El cuerpo, la geometría, la sastrería, el oro y la sensualidad se encuentran en una propuesta de fuerte presencia visual.</p><a class="read" href="https://lavoirarg.substack.com/p/schiaparelli?r=8o6915" target="_blank" rel="noopener">Leer artículo →</a></div></article>
<article class="article"><div class="meta">Givenchy<br>Ready-to-Wear SS27</div><div><h3>La precisión también puede ser femenina</h3><p>Sastrería, geometría, cuero, denim y colores saturados bajo la dirección creativa de Sarah Burton.</p><a class="read" href="https://lavoirarg.substack.com/p/givenchy?r=8o6915" target="_blank" rel="noopener">Leer artículo →</a></div></article>
<article class="article"><div class="meta">Celine<br>Women’s Summer 2027</div><div><h3>Vestirse con emoción</h3><p>Michael Rider propone una idea de vestir funcional, espontánea y emocional, donde la ropa vuelve a ocupar el centro.</p><a class="read" href="https://lavoirarg.substack.com/p/celine?r=8o6915" target="_blank" rel="noopener">Leer artículo →</a></div></article>
<article class="article"><div class="meta">Hermès<br>Ready-to-Wear SS27</div><div><h3>Cuando el lujo aprende a moverse</h3><p>Cuero como segunda piel, pañuelos convertidos en prendas, ligereza y funcionalidad dentro del lenguaje de Hermès.</p><a class="read" href="https://lavoirarg.substack.com/p/hermes?r=8o6915" target="_blank" rel="noopener">Leer artículo →</a></div></article>
<article class="article"><div class="meta">Elie Saab<br>Ready-to-Wear SS27</div><div><h3>El viejo Hollywood se encuentra con el verano</h3><p>Glamour, boudoir, movimiento, bordados artesanales y texturas livianas como gasas y sedas.</p><a class="read" href="https://lavoirarg.substack.com/p/elie-saab?r=8o6915" target="_blank" rel="noopener">Leer artículo →</a></div></article>
<article class="article"><div class="meta">Comme des Garçons<br>Ready-to-Wear SS27</div><div><h3>La colección lleva la moda hacia el territorio del disfraz</h3><p>Una propuesta teatral y experimental donde el volumen y la construcción visual dominan la percepción del cuerpo.</p><a class="read" href="https://lavoirarg.substack.com/p/comme-des-garcons-lleva-la-coleccion?r=8o6915" target="_blank" rel="noopener">Leer artículo →</a></div></article>
<article class="article"><div class="meta">Ann Demeulemeester<br>Ready-to-Wear SS27</div><div><h3>Cuando el romanticismo oscuro se vuelve aburrido</h3><p>Una lectura crítica de Lonesome Heaven: negro, cuero, sedas y una estética coherente que, desde nuestra mirada, pierde sorpresa.</p><a class="read" href="https://lavoirarg.substack.com/p/ann-demeulemeester-cuando-el-romanticismo?r=8o6915" target="_blank" rel="noopener">Leer artículo →</a></div></article></section>

<div class="weather-panel" id="weatherPanel"><h3>World Weather</h3><div id="weatherList"><div class="weather-loading">CARGANDO CLIMAS…</div></div><div class="weather-note">Datos meteorológicos en tiempo real. Ciudades seleccionadas por L’AVOIR International Fashion Desk.</div></div>
<script>
const weatherCities=[["Puerto Madryn",-42.77,-65.04],["Buenos Aires",-34.60,-58.38],["New York",40.71,-74.01],["London",51.51,-0.13],["Paris",48.86,2.35],["Milan",45.46,9.19],["Madrid",40.42,-3.70],["Tokyo",35.68,139.65]];
const weatherCode={0:"Despejado",1:"Mayormente despejado",2:"Parcialmente nublado",3:"Nublado",45:"Niebla",48:"Niebla",51:"Llovizna",53:"Llovizna",55:"Llovizna",61:"Lluvia",63:"Lluvia",65:"Lluvia fuerte",71:"Nieve",73:"Nieve",75:"Nieve",80:"Chubascos",81:"Chubascos",82:"Chubascos fuertes",95:"Tormenta",96:"Tormenta",99:"Tormenta"};
const fab=document.getElementById("weatherFab"),panel=document.getElementById("weatherPanel"),list=document.getElementById("weatherList");
fab.addEventListener("click",()=>{panel.classList.toggle("open"); if(panel.classList.contains("open")&&!panel.dataset.loaded)loadWeather();});
async function loadWeather(){panel.dataset.loaded="1"; try{const rows=await Promise.all(weatherCities.map(async c=>{const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+c[1]+"&longitude="+c[2]+"&current=temperature_2m,apparent_temperature,weather_code&timezone=auto");const d=await r.json();return "<div class='weather-city'><span><strong>"+c[0]+"</strong><br>"+(weatherCode[d.current.weather_code]||"Condición actual")+"</span><span>"+Math.round(d.current.temperature_2m)+"°C</span></div>"}));list.innerHTML=rows.join("");}catch(e){list.innerHTML="<div class='weather-loading'>No se pudo cargar el clima. Intentá nuevamente.</div>";panel.dataset.loaded="";}}
</script></body></html>
